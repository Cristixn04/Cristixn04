<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0a191c"/>
      <stop offset="100%" stop-color="#051014"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#00ff90"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 40px; fill: url(#textGrad); }
    .subtitle { font-family: 'JetBrains Mono', Consolas, Monaco, monospace; font-size: 17px; fill: #00ff90; font-weight: 500; letter-spacing: 1px; }
    .badge { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #94a3b8; }
    .bracket { fill: #00ff90; }
  </style>

  <!-- Fondo base -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)"/>
  <rect width="898" height="238" x="1" y="1" rx="15" fill="none" stroke="#00ff90" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Líneas de cuadrícula estilo cyberpunk -->
  <g opacity="0.07" stroke="#00ff90" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="240" />
    <line x1="150" y1="0" x2="150" y2="240" />
    <line x1="250" y1="0" x2="250" y2="240" />
    <line x1="350" y1="0" x2="350" y2="240" />
    <line x1="450" y1="0" x2="450" y2="240" />
    <line x1="550" y1="0" x2="550" y2="240" />
    <line x1="650" y1="0" x2="650" y2="240" />
    <line x1="750" y1="0" x2="750" y2="240" />
    <line x1="850" y1="0" x2="850" y2="240" />
    <line x1="0" y1="60" x2="900" y2="60" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="180" x2="900" y2="180" />
  </g>

  <!-- Onda inferior neón -->
  <path d="M 0,195 Q 225,160 450,190 T 900,185 L 900,240 L 0,240 Z" fill="#00ff90" fill-opacity="0.08" />
  <path d="M 0,205 Q 225,175 450,200 T 900,195 L 900,240 L 0,240 Z" fill="#00ff90" fill-opacity="0.12" />
  <path d="M 0,205 Q 225,175 450,200 T 900,195" fill="none" stroke="#00ff90" stroke-width="2" filter="url(#glow)"/>

  <!-- Destellos de luz -->
  <circle cx="820" cy="50" r="100" fill="#00ff90" fill-opacity="0.04" filter="url(#glow)"/>
  <circle cx="100" cy="180" r="80" fill="#00b4d8" fill-opacity="0.04" filter="url(#glow)"/>

  <!-- Indicador Disponible -->
  <g transform="translate(60, 48)">
    <circle cx="0" cy="0" r="5" fill="#00ff90" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#00ff90" stroke-width="1.5" opacity="0.6"/>
    <text x="16" y="4" class="badge">DISPONIBLE PARA NUEVOS PROYECTOS</text>
  </g>

  <!-- Título principal -->
  <text x="60" y="112" class="title">
    <tspan class="bracket">&lt;</tspan>Cristian Camilo Muñoz<tspan class="bracket"> /&gt;</tspan>
  </text>

  <!-- Subtítulo -->
  <text x="60" y="152" class="subtitle">
    FULL STACK DEVELOPER  •  BACKEND &amp; IA AUTOMATION
  </text>

  <!-- Tecnologías destacadas -->
  <g transform="translate(60, 185)">
    <text x="0" y="0" class="badge">⚡ Java | Spring Boot</text>
    <text x="180" y="0" class="badge">🐍 Python</text>
    <text x="270" y="0" class="badge">🐬 PostgreSQL &amp; MySQL</text>
    <text x="475" y="0" class="badge">🤖 n8n &amp; AI Agents</text>
    <text x="655" y="0" class="badge">🐳 Docker &amp; Linux</text>
  </g>
</svg>
